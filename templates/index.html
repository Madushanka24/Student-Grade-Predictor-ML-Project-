<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Grade Predictor</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 600px;
            margin-top: 50px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        h1 {
            margin-bottom: 30px;
            text-align: center;
        }
        .result {
            margin-top: 20px;
            text-align: center;
        }
        img {
            display: block;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Grade Predictor</h1>
        <form method="POST">
            <div class="mb-3">
                <label for="study_hours" class="form-label">Study Hours</label>
                <input type="number" class="form-control" name="study_hours" step="0.1" required>
            </div>
            <div class="mb-3">
                <label for="attendance" class="form-label">Attendance %</label>
                <input type="number" class="form-control" name="attendance" step="0.1" required>
            </div>
            <div class="mb-3">
                <label for="assignment" class="form-label">Assignment Score</label>
                <input type="number" class="form-control" name="assignment" step="0.1" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Predict</button>
        </form>

        {% if result %}
            <div class="result">
                <h3>Predicted Marks: {{ result }}</h3>
                <h3>Grade: {{ grade }}</h3>
                <p>Model Accuracy (R²): {{ model_r2 }} | MAE: {{ model_mae }}</p>
                <img src="{{ url_for('static', filename='chart.png') }}" alt="Accuracy Chart" width="400">
            </div>
        {% endif %}
    </div>

    <!-- Bootstrap JS (optional for interactivity) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
