<!DOCTYPE html>
<html>
<head>
    <title>Student Grade Predictor</title>
</head>
<body>
    <h1>Student Grade Predictor</h1>
    <form method="POST">
        <label>Study Hours:</label>
        <input type="number" name="study_hours" step="0.1" required><br><br>

        <label>Attendance %:</label>
        <input type="number" name="attendance" step="0.1" required><br><br>

        <label>Assignment Score:</label>
        <input type="number" name="assignment" step="0.1" required><br><br>

        <button type="submit">Predict</button>
    </form>

    {% if result %}
        <h2>Predicted Marks: {{ result }}</h2>
        <h2>Grade: {{ grade }}</h2>
    {% endif %}
</body>
</html>
